services:
  - type: web
    name: linkup
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINKUP_NS
        value: linkup_db
      - key: LINKUP_DB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
